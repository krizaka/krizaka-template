sonar.projectKey=krizaka_krizaka-template
sonar.organization=krizaka
sonar.sources=bin,scripts,base,targets
sonar.tests=bin,scripts
sonar.test.inclusions=**/*.test.mjs
sonar.exclusions=**/node_modules/**,**/pnpm-lock.yaml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# targets/ and base/ are the files a generated product starts from, not the generator: each target's own tests run in its
# prove job inside the generated project, so they carry no coverage here.
sonar.coverage.exclusions=targets/**,base/**
